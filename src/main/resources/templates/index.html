	    body {
	        font-family: sans-serif;
	        max-width: 900px;
	        margin: 30px auto;
	        padding: 0 20px;
	        line-height: 1.7;
	    }

	    h1, h2, h3, h4 {
	        margin-top: 24px;
	    }

	    label {
	        display: inline-block;
	        margin: 5px 0;
	    }

	    select,
	    input,
	    textarea {
	        padding: 6px 8px;
	        margin-left: 6px;
	    }

	    textarea {
	        width: 100%;
	        max-width: 600px;
	        box-sizing: border-box;
	    }

	    button {
	        padding: 10px 24px;
	        font-size: 16px;
	        cursor: pointer;
	    }

	    hr {
	        margin: 24px 0;
	    }
		.equipment-box {
		    border: 1px solid #cccccc;
		    border-radius: 8px;
		    padding: 15px;
		    margin: 15px 0;
		}

		.equipment-box h4 {
		    margin-top: 0;
		}
		.section-box {
		    border: 1px solid #dddddd;
		    border-radius: 10px;
		    padding: 18px;
		    margin: 20px 0;
		}

		.section-box > h3 {
		    margin-top: 0;
		}
		.submit-area {
		    text-align: center;
		    margin: 30px 0 50px;
		}

		.submit-area button {
		    padding: 12px 50px;
		    font-size: 18px;
		    font-weight: bold;
		    border-radius: 8px;
		    cursor: pointer;
		}
		.success-message {
		    border: 1px solid #8bc98b;
		    background-color: #eef9ee;
		    border-radius: 8px;
		    padding: 10px 16px;
		    margin: 15px 0 25px;
		}

    <script>

        function getValue(id) {

            const value =
                document.getElementById(id).value;

            if (value === "") {
                return 0;
            }

            return Number(value);
        }


        function updateTotals() {

            const startTotal =
                getValue("startStrength")
                + getValue("startStamina")
                + getValue("startTechnique")
                + getValue("startToughness")
                + getValue("startAgility")
                + getValue("startMental");

            document.getElementById(
                "startTotal"
            ).value = startTotal;


            const endTotal =
                getValue("endStrength")
                + getValue("endStamina")
                + getValue("endTechnique")
                + getValue("endToughness")
                + getValue("endAgility")
                + getValue("endMental");

            document.getElementById(
                "endTotal"
            ).value = endTotal;
        }


        const statusFields = [

            "startStrength",
            "startStamina",
            "startTechnique",
            "startToughness",
            "startAgility",
            "startMental",

            "endStrength",
            "endStamina",
            "endTechnique",
            "endToughness",
            "endAgility",
            "endMental"

        ];


        statusFields.forEach(function(id) {

            document.getElementById(id)
                .addEventListener(
                    "input",
                    updateTotals
                );

        });

    </script>

	<script>

	    document.querySelector("form")
	        .addEventListener("submit", function(event) {

	            const fighter =
	                document.getElementById("fighterName").value;

	            const supporters = [
	                document.getElementById("supporter1").value,
	                document.getElementById("supporter2").value,
	                document.getElementById("supporter3").value,
	                document.getElementById("supporter4").value,
	                document.getElementById("supporter5").value
	            ];

	            // 育成キャラとサポーターの重複
	            if (supporters.includes(fighter)) {

	                event.preventDefault();

	                alert(
	                    "育成キャラクターと同じキャラクターを" +
	                    "サポーターには選択できんね。"
	                );

	                return;
	            }

	            // サポーター同士の重複
	            const uniqueSupporters =
	                new Set(supporters);

	            if (uniqueSupporters.size !== supporters.length) {

	                event.preventDefault();

	                alert(
	                    "同じサポーターを複数選択することはできんね。"
	                );

	                return;
	            }
				// ================================
				// シーンカード3枚の重複チェック
				// ================================

				const sceneCards = [
				    document.getElementById("sceneCard1").value,
				    document.getElementById("sceneCard2").value,
				    document.getElementById("sceneCard3").value
				];

				const uniqueSceneCards =
				    new Set(sceneCards);

				if (uniqueSceneCards.size !== sceneCards.length) {

				    event.preventDefault();

				    alert(
				        "同じシーンカードを複数選択することはできんね。"
				    );

				    return;
				}
				
	        });

	</script>

	            return { min: 5, max: 20 };
	        }

	        if (name === "究極鍛錬率") {
	            return { min: 5, max: 20 };
	        }

	        if (name.startsWith("常時")
	                && name.endsWith("獲得量上昇")) {

	            return { min: 5, max: 25 };
	        }

	        if (name.includes("究極鍛錬率上昇")) {
	            return { min: 36, max: 90 };
	        }

	        if (name.includes("エクストラボーナス1段階")) {
	            return { min: 12, max: 50 };
	        }

	        if (name.includes("エクストラボーナス2段階")) {
	            return { min: 15, max: 25 };
	        }

	        if (name.includes("闘気覚醒発生率上昇")) {
	            return { min: 5, max: 15 };
	        }

	        if (name.endsWith("固定ボーナス")) {
	            return { min: 10, max: 30 };
	        }

	        // 「極技 ○○」は今のところ数値制限なし
	        if (name.startsWith("極技 ")) {
	            return null;
	        }

	        return null;
	    }


	    // ========================================
	    // 9個のサブ能力欄をまとめて設定
	    // ========================================

	    const subAbilityFields = [

	        "equipment1Sub1",
	        "equipment1Sub2",
	        "equipment1Sub3",

	        "equipment2Sub1",
	        "equipment2Sub2",
	        "equipment2Sub3",

	        "equipment3Sub1",
	        "equipment3Sub2",
	        "equipment3Sub3"

	    ];


	    subAbilityFields.forEach(function(fieldName) {

	        const select =
	            document.querySelector(
	                '[name="' + fieldName + 'Name"]'
	            );

	        const input =
	            document.querySelector(
	                '[name="' + fieldName + 'Value"]'
	            );


				select.addEventListener("change", function() {

				    // ========================================
				    // 極技
				    // ========================================

				    if (select.value.startsWith("極技 ")) {

				        // DBには0を保存する
				        input.value = 0;

				        // 手入力できないようにする
				        input.readOnly = true;

				        // 通常能力用の範囲指定を解除
				        input.removeAttribute("min");
				        input.removeAttribute("max");

				        input.placeholder = "確定付与";

				        return;
				    }


				    // ========================================
				    // 極技以外
				    // ========================================

				    input.readOnly = false;

				    const range =
				        getSubAbilityRange(select.value);


				    // 範囲設定がない能力
				    if (range === null) {

				        input.removeAttribute("min");
				        input.removeAttribute("max");

				        input.placeholder = "値";

				        return;
				    }


				    // ========================================
				    // 最小値・最大値を設定
				    // ========================================

				    input.min = range.min;
				    input.max = range.max;

				    input.placeholder =
				        range.min + "～" + range.max;


				    // ========================================
				    // 現在の値が範囲外なら消す
				    // ========================================

				    if (input.value !== "") {

				        const value = Number(input.value);

				        if (value < range.min
				                || value > range.max) {

				            input.value = "";
				        }
				    }

				});
				

	    });

	</script>
	
	
	
	<br>
</body>
